---

- name: "Server verify"
  hosts: all
  vars:
    aegir_user: aegir
  tasks:
    - name: Run CMS-specific tasks
      ansible.builtin.include_tasks: "verify/nginx.yml"

    # TODO Move this into an Upgrade task instead?
    - name: Update the hosting module using git pull
      ansible.builtin.command: "git pull"
      args:
        chdir: "/var/aegir/admin/web/modules/hosting"
      become: true
      become_user: "{{ aegir_user }}"

    - name: Update the Aegir site database
      shell:
        chdir: "/var/aegir/admin/web"
        cmd: "/usr/local/bin/bee updb -y"

    - name: Create symlinks for Aegir helper scripts
      ansible.builtin.file:
        src: "/usr/local/aegir-ansible-playbooks/bin/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        force: true
        owner: "root"
        group: "root"
        state: "link"
      with_items:
        - cvlog
        - aegir-weekly.sh

