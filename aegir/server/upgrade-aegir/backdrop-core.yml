---

# Upgrade BackdropCMS core (the Aegir frontend)

# Using no_log because we run in verbose mode, and this will show false warnings in the log
- name: Get latest BackdropCMS release info from GitHub
  uri:
    url: https://api.github.com/repos/backdrop/backdrop/releases/latest
    return_content: true
  register: backdrop_release
  no_log: true

- name: Set BackdropCMS core version fact
  set_fact:
    backdrop_version: "{{ backdrop_release.json.tag_name }}"

- name: Read bootstrap.inc for the version
  slurp:
    src: "{{ aegir_home }}/admin/web/core/includes/bootstrap.inc"
  register: bootstrap_file

# Generated by Claude, which argued that this avoids grep quoting headaches
- name: Extract current Backdrop version
  set_fact:
    backdrop_current_version: >-
      {{ (bootstrap_file.content | b64decode)
         | regex_search("define\('BACKDROP_VERSION',\s*'([0-9.]+)'\)", '\1')
         | first }}

- name: Determine if an upgrade is needed
  set_fact:
    backdrop_upgrade_needed: "{{ backdrop_current_version is version(backdrop_version, '<') }}"

- name: Create a random temporary directory
  ansible.builtin.tempfile:
    state: directory
    suffix: _backdrop_up
  register: temp_dir
  when: backdrop_upgrade_needed

- name: Download and extract Backdrop {{ backdrop_version }}
  unarchive:
    src: "https://github.com/backdrop/backdrop/releases/download/{{ backdrop_version }}/backdrop.zip"
    dest: "{{ temp_dir.path }}"
    remote_src: true
  when: backdrop_upgrade_needed

- name: Remove old core directory
  file:
    path: "{{ aegir_home }}/admin/web/core"
    state: absent
  when: backdrop_upgrade_needed

- name: Copy new core directory into place
  copy:
    src: "{{ temp_dir.path }}/backdrop/core/"
    dest: "{{ aegir_home }}/admin/web/core/"
    remote_src: true
    owner: "{{ aegir_user }}"
    group: "{{ aegir_user }}"
  when: backdrop_upgrade_needed

- name: Update root files shipped with core
  copy:
    src: "{{ temp_dir.path }}/backdrop/{{ item }}"
    dest: "{{ aegir_home }}/admin/web/{{ item }}"
    remote_src: true
    owner: "{{ aegir_user }}"
    group: "{{ aegir_user }}"
  loop:
    - index.php
    - .htaccess
    - robots.txt
  when: backdrop_upgrade_needed

- name: Clean up temp directory
  file:
    path: "{{ temp_dir.path }}"
    state: absent
  when:
    - temp_dir.path is defined
    - backdrop_upgrade_needed
