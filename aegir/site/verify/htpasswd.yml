---

- name: Create the htpasswd directory if necessary
  file:
    path: "/var/aegir/config/passwords.d/"
    state: directory
    owner: "aegir"
    group: "www-data"
    mode: "0750"

# We are creating a salt using the password itself, which is weak, but sufficient
# because this is only used for blocking bots.
# Also, we are not using Ansible's htpasswd to simplify installation dependencies.
- name: Create or update the htpasswd file
  ansible.builtin.copy:
    dest:  "/var/aegir/config/passwords.d/{{ inventory_hostname }}"
    owner: root
    group: www-data
    mode: "0640"
    content: |
      {{ http_basic_auth_username }}:{{ http_basic_auth_password | password_hash('sha512', (http_basic_auth_password | hash('sha256'))[:16]) }}
