---

- include_tasks: "{{ software }}/settings.yml"

- name: Run fix permissions
  shell:
    chdir: "{{ site_path }}"
    cmd: "/usr/local/aegir-ansible-playbooks/bin/fix-standalone-permissions.sh --site-path='{{ site_path }}'"
  tags:
    - civicrm-fixpermissions

- include_tasks: "{{ software }}/civicrm-cron.yml"
  when:
    - "'civicrm_sites' in group_names"
    - civicrm_ansible_cron_interval is defined
    - civicrm_ansible_cron_interval|int > 0
    - site_status|int == 1
  tags:
    - cron-civicrm

- include_tasks: "{{ software }}/civicrm-cron-remove.yml"
  when: civicrm_ansible_cron_interval is undefined or civicrm_ansible_cron_interval|int <= 0 or site_status|int != 1
  tags:
    - cron-civicrm
